<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | ShuleSmart</title>
<link rel="icon" type="image/svg+xml" href="../../images/favicon.svg">
<link rel="apple-touch-icon" href="../../images/favicon.svg">






<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/school-admin.css">
</head>
<body>
<div class="app">
  <aside class="sa-sidebar" id="sidebar"></aside>
  <div class="sa-sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main">
    <header class="sa-topbar" id="topbar"></header>
    <main class="sa-content">
      <div class="sa-page-head">
        <div>
          <h1 id="greetingText">Welcome 👋</h1>
          <p>Here's what's happening at your school today.</p>
        </div>
        <span class="sa-school-chip" id="schoolDateChip"><i class="fa-solid fa-calendar-days"></i> —</span>
      </div>

      <div class="sa-stats-grid" id="statsGrid"></div>

      <section class="sa-card">
        <div class="sa-card-header">
          <div><h2>Quick Actions</h2><p>Common daily tasks</p></div>
        </div>
        <div class="sa-card-body">
          <div class="sa-qa-grid">
            <button class="sa-qa-card" data-href="../students/"><span class="sa-qa-icon"><i class="fa-solid fa-user-plus"></i></span><div><h4>Add Student</h4><p>Enroll a new student</p></div></button>
            <button class="sa-qa-card" data-href="../teachers/"><span class="sa-qa-icon"><i class="fa-solid fa-chalkboard-user"></i></span><div><h4>Add Teacher</h4><p>Register a teacher</p></div></button>
            <button class="sa-qa-card" data-href="../attendance/"><span class="sa-qa-icon"><i class="fa-solid fa-clipboard-check"></i></span><div><h4>Record Attendance</h4><p>Mark today's attendance</p></div></button>
            <button class="sa-qa-card" data-href="../payments/"><span class="sa-qa-icon"><i class="fa-solid fa-hand-holding-dollar"></i></span><div><h4>Record Payment</h4><p>Log a fee payment</p></div></button>
            <button class="sa-qa-card" data-href="../exams/"><span class="sa-qa-icon"><i class="fa-solid fa-file-pen"></i></span><div><h4>Create Exam</h4><p>Schedule an examination</p></div></button>
            <button class="sa-qa-card" data-href="../classes/"><span class="sa-qa-icon"><i class="fa-solid fa-layer-group"></i></span><div><h4>Manage Classes</h4><p>Classes &amp; streams</p></div></button>
          </div>
        </div>
      </section>

      <section class="sa-card" style="margin-top:20px;">
        <div class="sa-card-header">
          <div><h2>Upcoming Exams</h2><p>Active examinations on your calendar</p></div>
        </div>
        <div class="sa-card-body" id="upcomingExams"></div>
      </section>
    </main>
  </div>
</div>
<div id="toastContainer"></div>
<div id="modalRoot"></div>

<script type="module">
import { requireSchoolAdmin } from "../js/auth.js";
import { apiGet } from "../js/api.js";
import { initShell, setTopbarTitle, showToast, loadingState, emptyState, errorState, formatDate, escapeHtml } from "../js/common.js";

const session = await requireSchoolAdmin();
initShell({ active: "dashboard" });
setTopbarTitle("Dashboard");
document.getElementById("schoolDateChip").innerHTML =
  '<i class="fa-solid fa-calendar-days"></i> ' + new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });

document.getElementById("greetingText").textContent =
  "Welcome, " + ((window.currentAdmin && window.currentAdmin.name) ? window.currentAdmin.name.split(" ")[0] : "") + " 👋";

const statsGrid = document.getElementById("statsGrid");
const examsEl = document.getElementById("upcomingExams");

function statCard(icon, bg, value, label) {
  return `<div class="sa-stat-card">
    <span class="sa-stat-icon" style="background:${bg[0]};color:${bg[1]};">${icon}</span>
    <div><div class="sa-stat-value">${escapeHtml(value)}</div><div class="sa-stat-label">${escapeHtml(label)}</div></div>
  </div>`;
}

async function loadDashboard() {
  loadingState(statsGrid, "Loading your school summary...");
  loadingState(examsEl, "Loading upcoming exams...");
  try {
    const res = await apiGet("/api/school/dashboard");
    const s = res.stats || {};
    statsGrid.innerHTML =
      statCard('<i class="fa-solid fa-user-graduate"></i>', ["rgba(37,99,235,0.1)", "var(--primary-light)"], s.totalStudents ?? 0, "Total Students") +
      statCard('<i class="fa-solid fa-chalkboard-user"></i>', ["rgba(20,184,166,0.12)", "var(--accent)"], s.activeTeachers ?? 0, "Active Teachers") +
      statCard('<i class="fa-solid fa-layer-group"></i>', ["rgba(30,58,138,0.1)", "var(--primary)"], s.totalClasses ?? 0, "Total Classes") +
      statCard('<i class="fa-solid fa-book"></i>', ["rgba(99,102,241,0.1)", "#6366F1"], s.totalSubjects ?? 0, "Total Subjects") +
      statCard('<i class="fa-solid fa-clipboard-check"></i>', ["rgba(16,185,129,0.1)", "var(--success)"], s.attendanceToday ?? 0, "Attendance Today") +
      statCard('<i class="fa-solid fa-file-pen"></i>', ["rgba(239,68,68,0.1)", "var(--danger)"], s.upcomingExams ?? 0, "Upcoming Exams");

    const exams = res.upcomingExams || [];
    if (exams.length === 0) {
      emptyState(examsEl, { icon: "fa-solid fa-file-pen", title: "No upcoming exams", message: "Scheduled examinations will appear here." });
    } else {
      examsEl.innerHTML = `<div class="sa-table-wrap"><table class="sa-table">
        <thead><tr><th>Exam</th><th>Starts</th><th>Ends</th></tr></thead>
        <tbody>${exams.map((e) => `<tr>
          <td class="sa-cell-primary">${escapeHtml(e.name)}</td>
          <td>${formatDate(e.start_date)}</td>
          <td>${formatDate(e.end_date)}</td>
        </tr>`).join("")}</tbody></table></div>`;
    }
  } catch (err) {
    errorState(statsGrid, err.message);
    errorState(examsEl, err.message);
    showToast("Could not load the dashboard.", "error");
  }
}

document.querySelectorAll("[data-href]").forEach((btn) => {
  btn.addEventListener("click", () => { window.location.href = btn.getAttribute("data-href"); });
});

await loadDashboard();
</script>
</body>
</html>
