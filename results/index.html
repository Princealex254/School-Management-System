<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results | ShuleSmart</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/school-admin.css">
</head>
<body>
<div class="app">
  <aside class="sa-sidebar" id="sidebar"></aside>
  <div class="sa-sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main">
    <header class="sa-topbar" id="topbar"></header>
    <main class="sa-content">
                  <div class="sa-page-head">
        <div>
          <h1>Results</h1>
          <p>View results and report cards.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="sa-btn sa-btn-secondary sa-btn-sm" id="printRankingBtn"><i class="fa-solid fa-file-pdf"></i> Download Ranking PDF</button>
          <button class="sa-btn sa-btn-secondary sa-btn-sm" id="printReportCardsBtn"><i class="fa-solid fa-print"></i> Print Report Cards</button>
        </div>
      </div>
      <div class="sa-card" style="margin-bottom:20px;">
        <div class="sa-card-body" style="padding:16px 22px;">
          <div class="sa-filters">
            <select class="sa-select" id="examSel"><option value="">Select exam…</option></select>
            <select class="sa-select" id="classSel"><option value="">All classes</option></select>
            <button class="sa-btn sa-btn-primary sa-btn-sm" id="loadBtn"><i class="fa-solid fa-chart-simple"></i> Load Results</button>
          </div>
          <div id="summaryBar" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;"></div>
        </div>
      </div>

      <div class="sa-card">
        <div class="sa-card-body">
          <div id="resultsWrap">
            <div class="sa-state"><i class="fa-solid fa-chart-simple"></i><h4>No results loaded</h4><p>Choose an exam (and optionally a class), then click “Load Results”.</p></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="toastContainer"></div>
<div id="modalRoot"></div>
<script type="module">
import { requireSchoolAdmin } from "../js/auth.js";
import { apiGet } from "../js/api.js";
import { initShell, setTopbarTitle, showToast, escapeHtml, loadingState, errorState } from "../js/common.js";
import { printClassRanking, printStudentReportCard, printStudentReportCards } from "../js/print.js";

await requireSchoolAdmin();
initShell({ active: "results" });
setTopbarTitle("Results");

const examSel = document.getElementById("examSel");
const classSel = document.getElementById("classSel");
const loadBtn = document.getElementById("loadBtn");
const printRankingBtn = document.getElementById("printRankingBtn");
const printReportCardsBtn = document.getElementById("printReportCardsBtn");
const resultsWrap = document.getElementById("resultsWrap");
const summaryBar = document.getElementById("summaryBar");

function fill(sel, rows, placeholder) {
  sel.innerHTML = `<option value="">${placeholder}</option>` +
    rows.map((r) => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join("");
}

async function loadRefs() {
  try {
    const [ex, cl] = await Promise.all([apiGet("/api/exams"), apiGet("/api/classes")]);
    fill(examSel, (ex.exams || []).map((e) => ({ id: e.id, name: e.name })), "Select exam…");
    fill(classSel, (cl.classes || []).map((c) => ({ id: c.id, name: c.name + (c.stream ? " - " + c.stream : "") })), "All classes");
  } catch (e) {
    showToast("Could not load exams / classes.", "error");
  }
}

async function loadResults() {
  if (!examSel.value) { showToast("Choose an exam first.", "warning"); return; }
  loadingState(resultsWrap, "Computing results…");
  try {
    const p = new URLSearchParams({ exam_id: examSel.value });
    if (classSel.value) p.set("class_id", classSel.value);
    const d = await apiGet("/api/results?" + p.toString());
    const rows = d.results || [];

    if (!rows.length) {
      resultsWrap.innerHTML = `<div class="sa-state"><i class="fa-solid fa-chart-simple"></i><h4>No marks found</h4><p>Enter marks for this exam first — results are computed from them.</p></div>`;
      summaryBar.innerHTML = "";
      return;
    }

    const graded = rows.filter((r) => r.average != null);
    const classAvg = graded.length
      ? Math.round((graded.reduce((s, r) => s + r.average, 0) / graded.length) * 100) / 100
      : null;
    const top = graded[0] || null;

    summaryBar.innerHTML =
      `<span class="sa-badge sa-badge-info">Students ${rows.length}</span>` +
      `<span class="sa-badge sa-badge-success">Class average ${classAvg != null ? classAvg + "%" : "—"}</span>` +
      (top ? `<span class="sa-badge sa-badge-warning">Top: ${escapeHtml(top.name)} (${top.average}%)</span>` : "");

        resultsWrap.innerHTML =
      `<div class="sa-table-wrap"><table class="sa-table"><thead><tr><th>Rank</th><th>Adm. No.</th><th>Student</th><th style="text-align:right;">Subjects</th><th style="text-align:right;">Total</th><th style="text-align:right;">Average %</th><th style="width:36px;"></th></tr></thead><tbody>` +
      rows.map((r, i) =>
        `<tr>` +
        `<td>${i + 1}${i === 0 && r.average != null ? ' <i class="fa-solid fa-trophy" style="color:#D97706;" title="Top of class"></i>' : ""}</td>` +
        `<td>${escapeHtml(r.admission_number || "—")}</td>` +
        `<td>${escapeHtml(r.name)}</td>` +
        `<td style="text-align:right;">${r.subject_count}</td>` +
        `<td style="text-align:right;">${Number(r.total || 0).toLocaleString("en-KE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>` +
                `<td style="text-align:right;font-weight:700;">${r.average != null ? r.average + "%" : "—"}</td>` +
        `<td><div class="sa-row-actions"><button data-print="${r.student_id}" title="Print report card"><i class="fa-solid fa-print"></i></button></div></td>` +
        `</tr>`
      ).join("") + `</tbody></table></div>`;
  } catch (err) {
    errorState(resultsWrap, err.message || "Could not load results.");
    summaryBar.innerHTML = "";
  }
}

loadBtn.addEventListener("click", loadResults);
examSel.addEventListener("change", () => { if (examSel.value) loadResults(); });

/* ---- PDF / print actions (class ranking + report cards) ---- */
printRankingBtn.addEventListener("click", () => {
  if (!examSel.value) { showToast("Choose an exam first.", "warning"); return; }
  showToast("Opening ranking PDF…", "info");
  printClassRanking(examSel.value, classSel.value || null)
    .catch((err) => showToast(err.message || "Could not generate the ranking.", "error"));
});

printReportCardsBtn.addEventListener("click", () => {
  if (!examSel.value) { showToast("Choose an exam first.", "warning"); return; }
  if (!classSel.value) { showToast("Select a class to scope the report cards.", "warning"); return; }
  showToast("Building report cards…", "info");
  printStudentReportCards(examSel.value, classSel.value)
    .catch((err) => showToast(err.message || "Could not generate report cards.", "error"));
});

/* Per-student "Print" button (delegated, since the results table rebuilds). */
resultsWrap.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-print]");
  if (!btn) return;
  if (!examSel.value) { showToast("Choose an exam first.", "warning"); return; }
  showToast("Opening report card…", "info");
  printStudentReportCard(examSel.value, btn.dataset.print, classSel.value || null)
    .catch((err) => showToast(err.message || "Could not print the report card.", "error"));
});

await loadRefs();
</script>
</body>
</html>
