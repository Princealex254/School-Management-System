<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Users | ShuleSmart</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/school-admin.css">
<style>
.sa-rights-matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:6px;}
.sa-rights-group{border:1px solid var(--border,#e5e7eb);border-radius:12px;padding:10px;background:var(--surface,#fff);}
.sa-rights-group-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary,#64748b);margin-bottom:8px;}
.sa-rights-item{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text,#0f172a);}
.sa-rights-item:hover{background:var(--surface-2,#f1f5f9);}
.sa-rights-item input[type="checkbox"]{accent-color:var(--primary,#2563eb);width:15px;height:15px;cursor:pointer;}
.sa-rights-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--text-secondary,#64748b);}
.sa-link-btn{background:none;border:none;color:var(--primary,#2563eb);cursor:pointer;font-size:12.5px;font-weight:600;padding:0;}
.sa-link-btn:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="app">
<aside class="sa-sidebar" id="sidebar"></aside>
<div class="sa-sidebar-overlay" id="sidebarOverlay"></div>
<div class="main">
<header class="sa-topbar" id="topbar"></header>
<main class="sa-content">
<div class="sa-page-head"><div><h1>Portal Users</h1><p>Create sign-in accounts for your staff and assign what each one can see.</p></div><button class="sa-btn sa-btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> Add Portal User</button></div>
<div class="sa-card"><div class="sa-card-body">
<div class="sa-filters"><input type="text" class="sa-input" id="searchInput" placeholder="Search name, email…"><select class="sa-select" id="statusSel"></select></div>
<div id="listContainer"></div>
<div id="pagerBar" style="display:none;margin-top:16px;"></div>
</div></div>
</main>
</div>
</div>
<div id="toastContainer"></div>
<div id="modalRoot"></div>
<script type="module">
import { requireSchoolAdmin } from "../js/auth.js";
import { apiGet, apiPost, apiPut, apiPatch } from "../js/api.js";
import { initShell, setTopbarTitle, showToast, escapeHtml, initials, formatDate, formatCurrency, badgeHtml, loadingState, emptyState, errorState, openModal, closeModal, confirmDialog, PORTAL_ROLES, portalRoleLabel, NAV_GROUPS, ACCESS_KEYS, menusForRole } from "../js/common.js";
const H = { E: escapeHtml, D: formatDate, B: badgeHtml, C: formatCurrency, RL: portalRoleLabel, R: rightsSummary };
const CFG = {"nav":"users","title":"Portal Users","heading":"Portal Users","desc":"Create sign-in accounts and assign portal roles.","icon":"fa-solid fa-users-gear","addLabel":"Add Portal User","endpoint":"/api/users","key":"users","search":true,"statuses":["active","inactive"],"fields":[{"id":"display_name","label":"Full Name","req":true},{"id":"email","label":"Email (sign-in)","type":"email","req":true},{"id":"password","label":"Temporary Password (new accounts)"},{"id":"role","label":"Portal Role","type":"select","req":true,"options":[""]}],"cols":[{"l":"Name","x":"E(r.display_name)"},{"l":"Email","x":"E(r.email||'\\u2014')"},{"l":"Role","x":"E(RL(r.role||'head'))"},{"l":"Rights","x":"R(r)"},{"l":"Status","x":"B(r.status)"}]};
/* The select stores the role KEY; options come straight from the shared registry. */
const roleField = CFG.fields.find((f) => f.id === "role");
roleField.options = ["", ...Object.keys(PORTAL_ROLES)];

/* ---- Rights helpers (visible grant list on the Portal Users screen) ---- */
function rightsSummary(r) {
  if (!r) return "—";
  if (r.menu_access === "*") return "All sections";
  if (Array.isArray(r.menu_access)) return r.menu_access.length + " / " + ACCESS_KEYS.length + " sections";
  const def = menusForRole(r.role || "head");
  return (def === "*" ? ACCESS_KEYS.length : def.length) + " / " + ACCESS_KEYS.length + " sections (role)";
}
function rightsMatrixHtml(selected) {
  const sel = new Set(selected || []);
  return `<div class="sa-form-group" style="grid-column:1/-1;">
      <label>Portal Rights <span style="font-weight:500;color:var(--text-secondary);">— tick exactly what this account can access. Pick a role to pre-fill its preset, then adjust.</span></label>
      <div class="sa-rights-matrix">` + NAV_GROUPS.map((g) => `
        <div class="sa-rights-group">
          <div class="sa-rights-group-label">${escapeHtml(g.label)}</div>
          ${g.items.map((i) => `
          <label class="sa-rights-item"><input type="checkbox" class="sa-rights-check" data-key="${i.key}" ${sel.has(i.key) ? "checked" : ""}><i class="${i.icon}"></i><span>${escapeHtml(i.label)}</span></label>`).join("")}
        </div>`).join("") + `</div>
      <div class="sa-rights-foot"><span id="rightsCount"></span><span>·</span><button type="button" class="sa-link-btn" id="rightsAll">Select all</button><span>·</span><button type="button" class="sa-link-btn" id="rightsNone">Clear all</button></div>
    </div>`;
}
function selectedKeys() {
  return Array.from(document.querySelectorAll(".sa-rights-check:checked")).map((c) => c.dataset.key);
}
function updateRightsCount() {
  const el = document.getElementById("rightsCount");
  if (!el) return;
  const n = selectedKeys().length;
  el.textContent = (n === ACCESS_KEYS.length ? "All sections selected" : `${n} of ${ACCESS_KEYS.length} sections selected`);
}

await requireSchoolAdmin();
initShell({ active: CFG.nav });
setTopbarTitle(CFG.heading);
if (CFG.addable !== 0) document.getElementById("addBtn").innerHTML = '<i class="fa-solid fa-plus"></i> ' + CFG.addLabel;
const PAGE = 10;
let state = { search: "", status: "", offset: 0, total: 0 };

const listContainer = document.getElementById("listContainer");
const pagerBar = document.getElementById("pagerBar");
function col(r, x) { return (new Function("r", "H", "const {E,D,B,C,RL,R}=H; return (" + x + ");"))(r, H); }
async function load() {
  loadingState(listContainer, "Loading…");
  pagerBar.style.display = "none";
  try {
    const p = new URLSearchParams();
    if (state.search) p.set("search", state.search);
    if (state.status) p.set("status", state.status);
    p.set("limit", String(PAGE)); p.set("offset", String(state.offset));
    const res = await apiGet(CFG.endpoint + "?" + p.toString());
    const rows = res[CFG.key] || [];
    state.total = res.total != null ? Number(res.total) : (state.offset + rows.length + (rows.length === PAGE ? 1 : 0));
    render(rows); pager();
  } catch (err) { errorState(listContainer, err.message); }
}
function render(rows) {
  if (!rows.length) { emptyState(listContainer, { icon: CFG.icon, title: "No portal users", message: "Add the staff who should sign in to this portal and assign their roles." }); return; }
  listContainer.innerHTML = `<div class="sa-table-wrap"><table class="sa-table"><thead><tr>` + CFG.cols.map((c) => `<th>${c.l}</th>`).join("") + `<th></th></tr></thead><tbody>` + rows.map((r) => `<tr>` + CFG.cols.map((c) => `<td>${col(r, c.x)}</td>`).join("") + `<td><div class="sa-row-actions"><button data-a="view" data-id="${r.id}" title="View"><i class="fa-solid fa-eye"></i></button><button data-a="edit" data-id="${r.id}" title="Edit name / role"><i class="fa-solid fa-pen"></i></button><button data-a="toggle" data-id="${r.id}" data-s="${r.status}" title="Activate/Deactivate"><i class="fa-solid fa-power-off"></i></button></div></td>` + `</tr>`).join("") + `</tbody></table></div>`;
  cache = rows;
  listContainer.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", () => act(b.dataset.a, b.dataset.id)));
}
function pager() {
  const hasPrev = state.offset > 0, hasNext = state.offset + PAGE < state.total;
  if (!hasPrev && !hasNext) { pagerBar.style.display = "none"; return; }
  pagerBar.style.display = "flex"; pagerBar.style.justifyContent = "space-between"; pagerBar.style.alignItems = "center";
  pagerBar.innerHTML = `<span class="sa-cell-sub">${state.total} account(s)</span><div style="display:flex;gap:8px;"><button class="sa-btn sa-btn-secondary sa-btn-sm" id="pP" ${hasPrev ? "" : "disabled"}><i class="fa-solid fa-chevron-left"></i></button><button class="sa-btn sa-btn-secondary sa-btn-sm" id="pN" ${hasNext ? "" : "disabled"}><i class="fa-solid fa-chevron-right"></i></button></div>`;
  pP.onclick = () => { state.offset -= PAGE; load(); }; pN.onclick = () => { state.offset += PAGE; load(); };
}
let cache = [];
async function act(a, id) {
  const rec = cache.find((x) => x.id === id);
  if (!rec) return;
  if (a === "view") return view(rec);
  if (a === "edit") return form(rec);
  if (a === "toggle") {
    const ns = rec.status === "active" ? "inactive" : "active";
    const isSelf = rec.email === ((window.currentAdmin || {}).email || "");
    if (!(await confirmDialog({ title: "Change status?", message: isSelf && ns === "inactive" ? "This is YOUR account — you cannot deactivate yourself." : `This sign-in account will be marked ${ns}.`, confirmText: "Yes", danger: ns !== "active" }))) return;
    try { await apiPatch(`${CFG.endpoint}/${id}/status`, { status: ns }); showToast("Updated.", "success"); load(); } catch (e) { showToast(e.message || "Failed.", "error"); }
  }
}
function view(r) {
  openModal(`<h3 class="sa-modal-title">Portal user</h3><div style="margin-top:14px;">` + [
    ["Name", r.display_name],
    ["Email", r.email],
    ["Role", portalRoleLabel(r.role || "head")],
    ["Rights", rightsSummary(r)],
    ["Status", (r.status || "active")]
  ].map(([k, v]) => `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;"><span style="color:var(--text-secondary);font-weight:600;">${k}</span><span style="font-weight:700;text-align:right;">${escapeHtml(v || "—")}</span></div>`).join("") + `<div class="sa-modal-actions"><button class="sa-btn sa-btn-primary" onclick="document.getElementById('modalRoot').innerHTML=''">Close</button></div></div>`);
}
function form(rec) {
  const isEdit = !!rec;
  openModal(`<h3 class="sa-modal-title">${isEdit ? "Edit portal user" : "Add portal user"}</h3><form id="gf" class="sa-form-grid" novalidate style="margin-top:14px;">` + CFG.fields.map((f) => { const v = rec ? (f.id === "password" ? "" : (rec[f.id] ?? "")) : ""; const req = f.req ? ' <span class="req">*</span>' : ""; let inp; if (f.type === "select") inp = `<select class="sa-select" data-f="${f.id}">` + f.options.map((o) => `<option value="${o}"${String(v) === o ? " selected" : ""}>${o === "" ? "— choose —" : o}</option>`).join("") + `</select>`; else inp = `<input class="sa-input" type="${f.type || "text"}" data-f="${f.id}" value="${escapeHtml(String(v ?? ""))}">`; return `<div class="sa-form-group"><label>${f.label}${req}</label>${inp}</div>`; }).join("") + rightsMatrixHtml(initialRights(rec)) + `<div class="sa-modal-actions" style="grid-column:1/-1;"><button type="button" class="sa-btn sa-btn-ghost" onclick="document.getElementById('modalRoot').innerHTML=''">Cancel</button><button type="submit" class="sa-btn sa-btn-primary" id="gfs">Save</button></div></form>`);
  /* Rights-matrix wiring. initialRights/collectAccess are function
     declarations, so they are hoisted and available to the modal built
     above. Picking a role re-fills its preset; the Head then tweaks ticks. */
  function initialRights(rec) {
    if (rec && rec.menu_access != null) return rec.menu_access === "*" ? ACCESS_KEYS : (rec.menu_access || []);
    const def = menusForRole((rec && rec.role) || "head");
    return def === "*" ? ACCESS_KEYS : def;
  }
  function collectAccess() {
    const n = selectedKeys().length;
    return n === ACCESS_KEYS.length ? "*" : selectedKeys();
  }
  const roleSelEl = document.querySelector('[data-f="role"]');
  const applyPreset = (role) => {
    const def = menusForRole(role || "head");
    const all = def === "*";
    document.querySelectorAll(".sa-rights-check").forEach((c) => { c.checked = all || def.includes(c.dataset.key); });
    updateRightsCount();
  };
  if (roleSelEl) roleSelEl.addEventListener("change", () => applyPreset(roleSelEl.value));
  document.getElementById("rightsAll").addEventListener("click", () => { document.querySelectorAll(".sa-rights-check").forEach((c) => { c.checked = true; }); updateRightsCount(); });
  document.getElementById("rightsNone").addEventListener("click", () => { document.querySelectorAll(".sa-rights-check").forEach((c) => { c.checked = false; }); updateRightsCount(); });
  document.querySelectorAll(".sa-rights-check").forEach((c) => c.addEventListener("change", updateRightsCount));
  updateRightsCount();

  document.getElementById("gf").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {};
    CFG.fields.forEach((f) => { const el = document.querySelector('[data-f="' + f.id + '"]'); payload[f.id] = el.value.trim(); });
    for (const f of CFG.fields) if (f.req && !payload[f.id]) { showToast(f.label.replace(/ \(.*\)/, "") + " is required.", "error"); return; }
    if (!isEdit && !payload.password) { showToast("A temporary password is required for new accounts.", "error"); return; }
    const password = payload.password;
    delete payload.password;
    payload.menu_access = JSON.stringify(collectAccess());
    const sb = document.getElementById("gfs"); sb.disabled = true; sb.innerHTML = "Saving...";
    try {
      if (isEdit) await apiPut(CFG.endpoint + "/" + rec.id, payload);
      else await apiPost(CFG.endpoint, Object.assign(payload, { password }));
      showToast("Saved successfully.", "success"); document.getElementById("modalRoot").innerHTML = ""; state.offset = 0; load();
    } catch (err) { showToast(err.message || "Save failed.", "error"); sb.disabled = false; sb.innerHTML = "Save"; }
  });
}
document.getElementById("addBtn").addEventListener("click", () => form(null));
const si = document.getElementById("searchInput");
si.style.display = CFG.search ? "block" : "none";
si.addEventListener("input", (e) => { clearTimeout(window.__t); window.__t = setTimeout(() => { state.search = e.target.value.trim(); state.offset = 0; load(); }, 350); });
const ss = document.getElementById("statusSel");
ss.style.display = CFG.statuses ? "block" : "none";
if (CFG.statuses) { ss.innerHTML = '<option value="">All Statuses</option>' + CFG.statuses.map((s) => `<option value="${s}">${s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join(""); ss.addEventListener("change", (e) => { state.status = e.target.value; state.offset = 0; load(); }); }
load();
</script>
</body>
</html>
