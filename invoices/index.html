<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoices | ShuleSmart</title>
<link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
<link rel="apple-touch-icon" href="../images/favicon.svg">






<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/school-admin.css">
</head>
<body>
<div class="app">
<aside class="sa-sidebar" id="sidebar"></aside>
<div class="sa-sidebar-overlay" id="sidebarOverlay"></div>
<div class="main">
<header class="sa-topbar" id="topbar"></header>
<main class="sa-content">
<div class="sa-page-head"><div><h1>Invoices</h1><p>Generate invoices from fee structures, then issue and post charges to student ledgers.</p></div><button class="sa-btn sa-btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> Generate Invoices</button></div>
<div class="sa-card"><div class="sa-card-body">
<div class="sa-filters">
  <input type="text" class="sa-input" id="searchInput" placeholder="Search invoice no., student, admission…">
  <select class="sa-select" id="statusSel">
    <option value="">All Statuses</option>
    <option value="DRAFT">Draft</option>
    <option value="ISSUED">Issued</option>
    <option value="PARTIALLY_PAID">Partially Paid</option>
    <option value="PAID">Paid</option>
    <option value="CANCELLED">Cancelled</option>
  </select>
  <select class="sa-select" id="yearSel" style="max-width:170px;"><option value="">All Years</option></select>
</div>
<div id="listContainer"></div>
<div id="pagerBar" style="display:none;margin-top:16px;"></div>
</div></div>
</main>
</div>
</div>
<div id="toastContainer"></div>
<div id="modalRoot"></div>
<script type="module">
import { requireSchoolAdmin } from "../js/auth.js";
import { apiGet, apiPost, apiPatch } from "../js/api.js";
import { initShell, setTopbarTitle, showToast, escapeHtml, formatDate, formatCurrency, loadingState, emptyState, errorState, openModal, closeModal, confirmDialog, searchableCombobox } from "../js/common.js";

await requireSchoolAdmin();
initShell({ active: "invoices" });
setTopbarTitle("Invoices");

const PAGE = 10;
let state = { search: "", status: "", year: "", offset: 0 };

/* Element references — previously used undeclared, so the list never rendered. */
const listContainer = document.getElementById("listContainer");
const pagerBar = document.getElementById("pagerBar");
const statusSel = document.getElementById("statusSel");
const yearSel = document.getElementById("yearSel");
/* NOTE: classWrap / studentsWrap are created dynamically inside the
   Generate-Invoices modal — look them up fresh inside generateForm()
   (they must not be hoisted to module scope, or they capture null). */
const REF = { structures: [], years: [], classes: [] };

async function loadRefs() {
  const jobs = [
    apiGet("/api/fee-structures").then((d) => { REF.structures = (d.feeStructures || []).filter((s) => s.status === "active"); }).catch(() => {}),
    apiGet("/api/academic-years").then((d) => { REF.years = d.academicYears || []; }).catch(() => {}),
    apiGet("/api/classes").then((d) => { REF.classes = d.classes || []; }).catch(() => {})
  ];
  await Promise.all(jobs);
  yearSel.innerHTML = '<option value="">All Years</option>' + REF.years.map((y) => `<option value="${y.id}">${escapeHtml(y.name)}</option>`).join("");
}

function statusBadge(s) {
  const map = { DRAFT: "sa-badge sa-badge-neutral", ISSUED: "sa-badge sa-badge-info", PARTIALLY_PAID: "sa-badge sa-badge-warning", PAID: "sa-badge sa-badge-success", OVERDUE: "sa-badge sa-badge-danger", CANCELLED: "sa-badge sa-badge-danger" };
  return `<span class="${map[s] || "sa-badge sa-badge-neutral"}">${escapeHtml(String(s || "").replace(/_/g, " ").toLowerCase())}</span>`;
}

async function load() {
  loadingState(listContainer, "Loading invoices…");
  pagerBar.style.display = "none";
  try {
    const p = new URLSearchParams();
    if (state.search) p.set("search", state.search);
    if (state.status) p.set("status", state.status);
    if (state.year) p.set("academic_year_id", state.year);
    p.set("limit", PAGE); p.set("offset", state.offset);
    const d = await apiGet("/api/invoices?" + p.toString());
    render(d.invoices || []);
  } catch (err) {
    errorState(listContainer, err.message || "Could not load invoices.");
  }
}

function render(rows) {
  if (!rows.length) { emptyState(listContainer, { icon: "fa-solid fa-file-invoice-dollar", title: "No invoices yet", message: "Use “Generate Invoices” to bill a class or selected students from a fee structure." }); return; }
  listContainer.innerHTML = `<div class="sa-table-wrap"><table class="sa-table"><thead><tr>
    <th>Invoice</th><th>Student</th><th>Period</th><th style="text-align:right;">Total</th><th style="text-align:right;">Paid</th><th>Status</th><th>Posted</th><th></th>
  </tr></thead><tbody>` + rows.map((r) => `<tr>
    <td><strong>${escapeHtml(r.invoice_number)}</strong><div class="sa-cell-sub">${formatDate(r.created_at)}</div></td>
    <td>${escapeHtml(r.student_name || "")}<div class="sa-cell-sub">${escapeHtml(r.admission_number || "")} • ${escapeHtml(r.class_name || "—")}</div></td>
    <td>${formatDate(r.issue_date)}</td>
    <td style="text-align:right;font-weight:700;">${formatCurrency(r.total_amount)}</td>
    <td style="text-align:right;">${formatCurrency(r.amount_paid || 0)}</td>
    <td>${statusBadge(r.status)}</td>
    <td>${r.posted_at ? '<span class="sa-badge sa-badge-success">Yes</span>' : '<span class="sa-badge sa-badge-neutral">No</span>'}</td>
    <td><div class="sa-row-actions">
      <button data-a="view" data-id="${r.id}" title="View"><i class="fa-solid fa-eye"></i></button>
      ${r.status === "DRAFT" ? `<button data-a="issue" data-id="${r.id}" title="Issue"><i class="fa-solid fa-paper-plane"></i></button>` : ""}
      ${!r.posted_at && r.status !== "CANCELLED" ? `<button data-a="post" data-id="${r.id}" title="Post charges to ledger"><i class="fa-solid fa-file-circle-check"></i></button>` : ""}
      ${!r.posted_at && r.status !== "CANCELLED" ? `<button data-a="cancel" data-id="${r.id}" title="Cancel invoice"><i class="fa-solid fa-ban"></i></button>` : ""}
    </div></td>
  </tr>`).join("") + `</tbody></table></div>`;
  listContainer.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", () => act(b.dataset.a, b.dataset.id)));
}

async function act(action, id) {
  try {
    if (action === "view") return view(id);
    if (action === "issue") {
      if (!(await confirmDialog({ title: "Issue this invoice?", message: "The invoice becomes visible as issued and can be posted to the ledger.", confirmText: "Issue", danger: false }))) return;
      await apiPatch(`/api/invoices/${id}/issue`, {});
      showToast("Invoice issued.", "success"); return load();
    }
    if (action === "post") {
      if (!(await confirmDialog({ title: "Post charges to the ledger?", message: "Charge lines will be appended to each student's ledger. This can only be done once per invoice.", confirmText: "Post Charges" }))) return;
      const res = await apiPost(`/api/invoices/${id}/post`, {});
      showToast(res.message || "Charges posted.", "success"); return load();
    }
    if (action === "cancel") {
      if (!(await confirmDialog({ title: "Cancel this invoice?", message: "Cancelled invoices cannot be issued or posted." }))) return;
      await apiPatch(`/api/invoices/${id}/cancel`, {});
      showToast("Invoice cancelled.", "success"); return load();
    }
  } catch (err) { showToast(err.message || "Action failed.", "error"); }
}
/* ---------- Invoice detail ---------- */
async function view(id) {
  openModal(`<h3 class="sa-modal-title">Invoice</h3><div id="invDetail"><p>Loading…</p></div>`);
  try {
    const d = await apiGet(`/api/invoices/${id}`);
    const inv = d.invoice || {};
    const items = d.items || [];
    const allocs = d.allocations || [];
    document.getElementById("invDetail").innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:12px 0;">
        <div><div class="k" style="font-size:11px;color:#64748B;font-weight:700;">INVOICE</div><strong>${escapeHtml(inv.invoice_number)}</strong></div>
        <div><div class="k" style="font-size:11px;color:#64748B;font-weight:700;">STUDENT</div><strong>${escapeHtml(inv.student_name || "")}</strong> <span class="sa-cell-sub">${escapeHtml(inv.admission_number || "")}</span></div>
        <div><div class="k" style="font-size:11px;color:#64748B;font-weight:700;">STATUS</div>${statusBadge(inv.status)} ${inv.posted_at ? '<span class="sa-badge sa-badge-success">Posted to ledger</span>' : ""}</div>
        <div><div class="k" style="font-size:11px;color:#64748B;font-weight:700;">PERIOD</div>${escapeHtml([inv.term_name, inv.academic_year_name].filter(Boolean).join(" • ") || "—")}</div>
      </div>
      <div class="sa-table-wrap"><table class="sa-table"><thead><tr><th>Description</th><th style="text-align:right;">Amount</th></tr></thead><tbody>
        ${items.map((it) => `<tr><td>${escapeHtml(it.description)}</td><td style="text-align:right;">${formatCurrency(it.amount)}</td></tr>`).join("")}
        ${Number(inv.discount_amount) > 0 ? `<tr><td style="color:#047857;">Discount</td><td style="text-align:right;color:#047857;">-${formatCurrency(inv.discount_amount)}</td></tr>` : ""}
        <tr><td style="font-weight:800;">TOTAL</td><td style="text-align:right;font-weight:800;">${formatCurrency(inv.total_amount)}</td></tr>
      </tbody></table></div>
      ${allocs.length ? `<div class="sa-form-section-title">Payments Applied</div><div class="sa-table-wrap"><table class="sa-table"><thead><tr><th>Receipt</th><th>Method</th><th style="text-align:right;">Amount</th></tr></thead><tbody>${allocs.map((a) => `<tr><td>${escapeHtml(a.receipt_no || "—")}</td><td>${escapeHtml(a.method || "—")}</td><td style="text-align:right;">${formatCurrency(a.amount)}</td></tr>`).join("")}</tbody></table></div>` : ""}
      <div class="sa-modal-actions">
        <button type="button" class="sa-btn sa-btn-ghost" onclick="document.getElementById('modalRoot').innerHTML=''">Close</button>
      </div>`;
  } catch (err) { showToast(err.message || "Could not load invoice.", "error"); }
}

/* ---------- Generate invoices ---------- */
function generateForm() {
  if (REF.structures.length === 0) { showToast("Create an active fee structure first.", "warning"); return; }
  openModal(`<h3 class="sa-modal-title">Generate Invoices</h3>
    <form id="genForm" class="sa-form-grid" novalidate style="margin-top:14px;">
      <div class="sa-form-group full"><label>Fee Structure <span class="req">*</span></label>
        <select class="sa-select" data-f="structure_id">${REF.structures.map((s) => `<option value="${s.id}">${escapeHtml(s.title)} — ${formatCurrency(s.total || 0)}</option>`).join("")}</select>
      </div>
      <div class="sa-form-group full"><label>Billing Target</label>
        <select class="sa-select" data-f="target">
          <option value="class">Entire class</option>
          <option value="students">Selected students</option>
        </select>
      </div>
      <div class="sa-form-group full" id="classWrap"><label>Class</label>
        <select class="sa-select" data-f="class_id"><option value="">All classes</option>${REF.classes.map((c) => `<option value="${c.id}">${escapeHtml(c.name + (c.stream ? " - " + c.stream : ""))}</option>`).join("")}</select>
      </div>
      <div class="sa-form-group full" id="studentsWrap" style="display:none;"><label>Students (search &amp; select multiple)</label>
        <div id="studentPicker"></div>
      </div>
      <div class="sa-form-group"><label>Due Date</label><input class="sa-input" type="date" data-f="due_date"></div>
      <div class="sa-form-group"><label>Discount Amount (KSh)</label><input class="sa-input" type="number" min="0" step="0.01" data-f="discount_amount" value="0"></div>
      <div class="sa-modal-actions" style="grid-column:1/-1;">
        <button type="button" class="sa-btn sa-btn-ghost" onclick="document.getElementById('modalRoot').innerHTML=''">Cancel</button>
        <button type="submit" class="sa-btn sa-btn-primary" id="genBtn"><i class="fa-solid fa-file-invoice-dollar"></i> Generate</button>
      </div>
    </form>`);

  /* Modal markup exists now — bind the wrappers explicitly. */
  const classWrap = document.getElementById("classWrap");
  const studentsWrap = document.getElementById("studentsWrap");
  const form = document.getElementById("genForm");
  form.querySelector('[data-f="target"]').addEventListener("change", (e) => {
    const isStudents = e.target.value === "students";
    studentsWrap.style.display = isStudents ? "block" : "none";
    classWrap.style.display = isStudents ? "none" : "block";
  });

  let studentsLoaded = false;
  let studentPicker = null;

  /* Build the searchable multi-select now (empty), then populate it from
     the API so the user can type to filter before opening. */
  studentPicker = searchableCombobox({
    container: document.getElementById("studentPicker"),
    options: [],
    multiple: true,
    placeholder: "Search student by name or admission no…"
  });
  (async () => {
    if (studentsLoaded) return;
    studentsLoaded = true;
    try {
      const d = await apiGet("/api/students?limit=500");
      studentPicker.setOptions((d.students || [])
        .map((s) => ({ id: s.id, label: `${s.first_name} ${s.last_name} (${s.admission_number})` })));
    } catch (e) { showToast("Could not load students.", "error"); }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const val = (f) => form.querySelector(`[data-f="${f}"]`).value;
    const payload = {
      structure_id: val("structure_id"),
      due_date: val("due_date") || undefined,
      discount_amount: Number(val("discount_amount") || 0)
    };
    if (val("target") === "students") {
      const sel = studentPicker.getValue();
      if (!sel.length) { showToast("Select at least one student.", "warning"); return; }
      payload.student_ids = sel;
    } else {
      payload.class_id = val("class_id") || undefined;
    }
    const btn = document.getElementById("genBtn");
    btn.disabled = true; btn.innerHTML = "Generating…";
    try {
      const res = await apiPost("/api/invoices", payload);
      closeModal();
      showToast(res.message || `${res.created} invoice(s) created.`, res.created ? "success" : "info");
      state.offset = 0; load();
    } catch (err) {
      showToast(err.message || "Generation failed.", "error");
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-file-invoice-dollar"></i> Generate';
    }
  });
}

document.getElementById("addBtn").addEventListener("click", generateForm);

const si = document.getElementById("searchInput");
si.addEventListener("input", (e) => { clearTimeout(window.__t); window.__t = setTimeout(() => { state.search = e.target.value.trim(); state.offset = 0; load(); }, 350); });
statusSel.addEventListener("change", (e) => { state.status = e.target.value; state.offset = 0; load(); });
yearSel.addEventListener("change", (e) => { state.year = e.target.value; state.offset = 0; load(); });

await loadRefs();
load();
</script>
</body>
</html>
