<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments | ShuleSmart</title>
<link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
<link rel="apple-touch-icon" href="../images/favicon.svg">






<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/school-admin.css">
</head>
<body>
<div class="app">
<aside class="sa-sidebar" id="sidebar"></aside>
<div class="sa-sidebar-overlay" id="sidebarOverlay"></div>
<div class="main">
<header class="sa-topbar" id="topbar"></header>
<main class="sa-content">
<div class="sa-page-head"><div><h1>Payments</h1><p>Record and review student payments.</p></div><button class="sa-btn sa-btn-primary" id="addBtn"><i class="fa-solid fa-plus"></i> Record Payment</button></div>
<div class="sa-card"><div class="sa-card-body">
<div class="sa-filters"><input type="text" class="sa-input" id="searchInput" placeholder="Search student, admission no., receipt, method…"><select class="sa-select" id="statusSel"></select></div>
<div id="listContainer"></div>
<div id="pagerBar" style="display:none;margin-top:16px;"></div>
</div></div>
</main>
</div>
</div>
<div id="toastContainer"></div>
<div id="modalRoot"></div>
<script type="module">
import { requireSchoolAdmin } from "../js/auth.js";
import { apiGet, apiPost, apiPut, apiPatch } from "../js/api.js";
import { initShell, setTopbarTitle, showToast, escapeHtml, initials, formatDate, formatCurrency, badgeHtml, loadingState, emptyState, errorState, openModal, closeModal, confirmDialog, searchableCombobox } from "../js/common.js";
import { printPaymentReceipt, printStudentStatement } from "../js/print.js";
const H = { E: escapeHtml, D: formatDate, B: badgeHtml, C: formatCurrency };
const CFG = {"cols":[{"x":"E(r.student_name)","l":"Student"},{"x":"E(r.admission_number)","l":"Adm."},{"x":"C(r.amount)","l":"Amount"},{"x":"E(r.method || \u0027—\u0027)","l":"Method"},{"x":"E(r.reference || \u0027—\u0027)","l":"Reference"},{"x":"D(r.payment_date)","l":"Date"}],"refs":[{"key":"students","url":"/api/students?limit=500","refId":"stu","labelExpr":"r.first_name+\u0027 \u0027+r.last_name+\u0027 (\u0027+r.admission_number+\u0027)\u0027"}],"desc":"Record and review student payments.","key":"payments","icon":"fa-solid fa-hand-holding-dollar","nav":"payments","heading":"Payments","fields":[{"id":"student_id","label":"Student","type":"ref","ref":"stu","full":1,"req":1},{"label":"Amount (KSh)","id":"amount","type":"number","req":1},{"label":"Method","id":"method","type":"select","options":["Cash","M-Pesa","Bank","Cheque","Other"]},{"id":"reference","label":"Reference"},{"label":"Payment Date","id":"payment_date","type":"date"},{"label":"Notes","full":1,"id":"notes","type":"textarea"}],"addLabel":"Record Payment","title":"Payments","endpoint":"/api/payments","search":true,"toggle":0};
await requireSchoolAdmin();
initShell({ active: CFG.nav });
setTopbarTitle(CFG.heading);
if (CFG.addable === 0) document.getElementById("addBtn").style.display = "none";
else document.getElementById("addBtn").innerHTML = '<i class="fa-solid fa-plus"></i> ' + CFG.addLabel;
const PAGE = 10;
let state = { search: "", status: "", offset: 0, total: 0 };

/* Element references — previously used undeclared, so the list never rendered. */
const listContainer = document.getElementById("listContainer");
const pagerBar = document.getElementById("pagerBar");
const REF = {};
if (CFG.refs) await Promise.all(CFG.refs.map(async (r) => { try { const d = await apiGet(r.url); REF[r.refId] = (d[r.key] || []).map((x) => ({ id: x.id, label: (new Function("r", "return " + r.labelExpr))(x) })); } catch (e) { REF[r.refId] = []; } }));
function R(rid, id) { if (!id) return "\u2014"; const hit = (REF[rid] || []).find((x) => x.id === id); return hit ? hit.label : "\u2014"; }
function col(r, x) { return (new Function("r", "H", "const {E,D,B,C,R}=H; return (" + x + ");"))(r, Object.assign(H, { R })); }
async function load() {
  loadingState(listContainer, "Loading...");
  pagerBar.style.display = "none";
  try {
    const p = new URLSearchParams();
    if (state.search && CFG.search) p.set("search", state.search);
    if (state.status && CFG.statuses) p.set("status", state.status);
    p.set("limit", String(PAGE)); p.set("offset", String(state.offset));
    const res = await apiGet(CFG.endpoint + "?" + p.toString());
    const rows = res[CFG.key] || [];
    state.total = res.total != null ? Number(res.total) : (state.offset + rows.length + (rows.length === PAGE ? 1 : 0));
    render(rows); pager();
  } catch (err) { errorState(listContainer, err.message); }
}
function render(rows) {
  if (!rows.length) { emptyState(listContainer, { icon: CFG.icon, title: "Nothing here yet", message: "Use the button above to add the first record." }); return; }
  listContainer.innerHTML = `<div class="sa-table-wrap"><table class="sa-table"><thead><tr>` + CFG.cols.map((c) => `<th>${c.l}</th>`).join("") + (CFG.toggle === false ? `<th style="text-align:right;">Status</th>` : "") + `<th></th></tr></thead><tbody>` + rows.map((r) => `<tr>` + CFG.cols.map((c) => `<td>${col(r, c.x)}</td>`).join("") + (CFG.toggle === false ? `<td>${String(r.status || "COMPLETED").toUpperCase() === "REVERSED" ? '<span class="sa-badge sa-badge-danger">Reversed</span>' : String(r.status || "").toUpperCase() === "REFUNDED" ? '<span class="sa-badge sa-badge-warning">Refunded</span>' : '<span class="sa-badge sa-badge-success">Completed</span>'}</td>` : "") + (CFG.toggle === false ? `<td><div class="sa-row-actions"><button data-a="receipt" data-id="${r.id}" title="Print receipt / statement"><i class="fa-solid fa-receipt"></i></button>${String(r.status || "COMPLETED").toUpperCase() === "COMPLETED" ? `<button data-a="reverse" data-id="${r.id}" title="Reverse payment"><i class="fa-solid fa-rotate-left"></i></button><button data-a="refund" data-id="${r.id}" title="Record refund"><i class="fa-solid fa-money-bill-transfer"></i></button>` : ""}</div></td>` : `<td><div class="sa-row-actions"><button data-a="view" data-id="${r.id}" title="View"><i class="fa-solid fa-eye"></i></button><button data-a="edit" data-id="${r.id}" title="Edit"><i class="fa-solid fa-pen"></i></button><button data-a="toggle" data-id="${r.id}" data-s="${r.status}" title="Activate/Deactivate"><i class="fa-solid fa-power-off"></i></button></div></td>`) + `</tr>`).join("") + `</tbody></table></div>`;
  cache = rows;
  listContainer.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", () => act(b.dataset.a, b.dataset.id, b.dataset.s)));
}
function pager() {
  const hasPrev = state.offset > 0, hasNext = state.offset + PAGE < state.total;
  if (!hasPrev && !hasNext) { pagerBar.style.display = "none"; return; }
  pagerBar.style.display = "flex"; pagerBar.style.justifyContent = "space-between"; pagerBar.style.alignItems = "center";
  pagerBar.innerHTML = `<span class="sa-cell-sub">${state.total} record(s)</span><div style="display:flex;gap:8px;"><button class="sa-btn sa-btn-secondary sa-btn-sm" id="pP" ${hasPrev ? "" : "disabled"}><i class="fa-solid fa-chevron-left"></i></button><button class="sa-btn sa-btn-secondary sa-btn-sm" id="pN" ${hasNext ? "" : "disabled"}><i class="fa-solid fa-chevron-right"></i></button></div>`;
  pP.onclick = () => { state.offset -= PAGE; load(); }; pN.onclick = () => { state.offset += PAGE; load(); };
}
let cache = [];
async function act(a, id, s) {
  const rec = cache.find((x) => x.id === id);
  if (a === "view") return view(rec);
  if (a === "receipt") return view(rec);
  if (a === "edit") return form(rec);
  if (a === "reverse") return reverseModal(rec);
  if (a === "refund") return refundModal(rec);
  if (a === "toggle") {
    const ns = s === "active" ? "inactive" : "active";
    if (!(await confirmDialog({ title: "Change status?", message: "It will be marked as " + ns + ".", confirmText: "Yes", danger: ns !== "active" }))) return;
    try { await apiPatch(CFG.endpoint + "/" + id + "/status", { status: ns }); showToast("Updated.", "success"); load(); } catch (e) { showToast(e.message || "Failed.", "error"); }
  }
}
function rowStudentInfo(r) {
  const name = (r.student_name || "").trim();
  const adm = (r.admission_number || "").trim();
  const cls = (r.class_name || "").trim();
  if (name) return { name, admission_number: adm, class_name: cls };
  const stu = (REF.stu || []).find((x) => x.id === r.student_id);
  const lbl = (stu && stu.label) || "";
  const m = lbl.match(/^(.*?)\s*\((.*?)\)\s*$/);
  return { name: (m ? m[1] : lbl).trim(), admission_number: (m ? m[2] : "").trim(), class_name: cls };
}

function view(r) {
  const info = rowStudentInfo(r);
  /* Financial figures arrive live (fetch below) — the list payload no longer
     ships school-wide ledger/allocation aggregates on every page load. */
  const fmtFin = (v) => (v == null ? "…" : formatCurrency(v));
  const row = [
    ["Student", info.name],
    ["Adm. No.", info.admission_number],
    ["Class", info.class_name],
    ["Receipt No.", r.receipt_no || "—"],
    ["Amount", formatCurrency(r.amount)],
    ["Method", r.method || "—"],
    ["Reference", r.reference || "—"],
    ["Paid On", formatDate(r.payment_date)],
    ["Recorded By", r.recorded_by || "—"],
    ["Applied to Fees", fmtFin(r.applied_to_fees), "finApplied"],
    ["Credit Carried", fmtFin(r.credit_carried), "finCredit"],
    ["Outstanding Balance", fmtFin(r.outstanding_balance), "finBalance"],
    ["Notes", r.notes || "—"]
  ];
  openModal(`<h3 class="sa-modal-title">Payment Receipt</h3>
    <div id="pReceiptBody" style="margin-top:14px;">` + row.map(([k, v, id]) => `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;"><span style="color:var(--text-secondary);font-weight:600;">${k}</span><span${id ? ` id="${id}"` : ""} style="font-weight:700;text-align:right;">${escapeHtml(v == null ? "—" : v)}</span></div>`).join("") + `
    <div class="sa-modal-actions">
      <button class="sa-btn sa-btn-secondary" id="pStmt"><i class="fa-solid fa-print"></i> Print / PDF Statement</button>
      <button class="sa-btn sa-btn-primary" id="pReceipt"><i class="fa-solid fa-print"></i> Print / PDF Receipt</button>
      <button class="sa-btn sa-btn-ghost" onclick="document.getElementById('modalRoot').innerHTML=''">Close</button>
    </div></div>`);

  /* Live figures for just this payment (≈3 reads) — fills the three
     placeholders above once the round-trip lands. Applied & Credit are
     reconciled so they always sum to the payment amount. Outstanding Balance
     always resolves to a real number: from the live call, else from the
     student's authoritative ledger statement, so it never stays "…". */
  const payAmount = Number(r.amount || 0);
  const set = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.textContent = formatCurrency(v); };
  const setFin = (applied, credit, balance) => {
    set("finApplied", applied);
    set("finCredit", credit);
    if (balance != null) set("finBalance", balance);
  };
  const applyFinancials = (appliedRaw, creditRaw, balance) => {
    const applied = Number(appliedRaw != null ? appliedRaw : 0) || 0;
    setFin(applied, Math.max(0, Math.round((payAmount - applied) * 100) / 100), balance != null ? Number(balance) : null);
  };
  const resolveBalanceFromStatement = () => {
    try {
      apiGet("/api/students/" + r.student_id + "/statement").then((s) => {
        const b = s && s.totals && s.totals.balance;
        if (b != null) set("finBalance", b);
      }).catch(() => {});
    } catch { /* ignore */ }
  };
  apiGet("/api/payments/" + r.id).then((d) => {
    if (!d || !d.success) { resolveBalanceFromStatement(); return; }
    applyFinancials(d.applied_to_fees, d.credit_carried, d.outstanding_balance);
  }).catch(() => {
    /* Live figures unavailable — surface what we have; resolve balance from
       the student statement so the ledger figure still appears. */
    applyFinancials(r.applied_to_fees, r.credit_carried, r.outstanding_balance != null ? r.outstanding_balance : null);
    resolveBalanceFromStatement();
  });

  /* Enrichment: whenever a student detail is missing (e.g. a just-recorded
     payment), fill the blank value spans from the student's statement record
     so the overlay shows everything immediately — no close/reopen needed. */
  if (!info.name || !info.admission_number || !info.class_name) {
    apiGet("/api/students/" + r.student_id + "/statement").then((d) => {
      if (!d || !d.student) return;
      const n = document.getElementById("pReceiptBody");
      if (!n) return;
      const stu = d.student;
      const vs = n.querySelectorAll("div > span:last-child");
      if (vs.length < 3) return;
      if (!info.name && stu.name) vs[0].textContent = stu.name;
      if (!info.admission_number && stu.admission_number) vs[1].textContent = stu.admission_number;
      if (!info.class_name && stu.class_name) vs[2].textContent = stu.class_name;
    }).catch(() => {});
  }

  /* Shared loader toggle for the print buttons: shows a spinner + label and
     disables the button while the print job is being prepared. Restores the
     original label on failure so the user can retry. */
  const withBtnSpin = (btnId, busyLabel, task) => {
    const btn = document.getElementById(btnId);
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> ${escapeHtml(busyLabel)}`;
    /* On success the print dialog opens (modal closes), so the button stays
       disabled. Only restore the original label on failure so the user can
       retry. */
    return task().catch((e) => {
      btn.disabled = false;
      btn.innerHTML = originalHtml;
      throw e;
    });
  };

  document.getElementById("pReceipt").addEventListener("click", async () => {
    try {
      await withBtnSpin("pReceipt", "Preparing receipt…", async () => {
        /* Fresh figures at print time; falls back to whatever the cached row
           carried (e.g. right after creating a payment) if the fetch fails. */
        let fin = null;
        try { fin = await apiGet("/api/payments/" + r.id); } catch { /* offline-safe */ }
        /* Applied is authoritative; Credit is derived so Applied + Credit = Amount. */
        const appliedToFees = Number((fin && fin.applied_to_fees != null ? fin.applied_to_fees : r.applied_to_fees)) || 0;
        const creditCarried = Math.max(0, Math.round((payAmount - appliedToFees) * 100) / 100);
        const balRaw = fin && fin.outstanding_balance != null ? fin.outstanding_balance : r.outstanding_balance;
        await printPaymentReceipt({
          payment: r,
          studentId: r.student_id,
          student: info,
          balance: (balRaw != null && balRaw !== "" ? Number(balRaw) : null),
          appliedToFees,
          creditCarried
        });
      });
      showToast("Opening print dialog…", "info");
    } catch (e) { showToast(e.message || "Could not print receipt.", "error"); }
  });
  document.getElementById("pStmt").addEventListener("click", async () => {
    try {
      await withBtnSpin("pStmt", "Preparing statement…", () => printStudentStatement(r.student_id, info));
      showToast("Opening print dialog…", "info");
    } catch (e) { showToast(e.message || "Could not print statement.", "error"); }
  });
}
/* ---------- Reverse a payment (creates a reversing ledger entry) ---------- */
function reverseModal(r) {
  openModal(`<h3 class="sa-modal-title">Reverse Payment</h3>
    <p class="sa-modal-message" style="margin-top:8px;">Receipt <strong>${escapeHtml(r.receipt_no || "")}</strong> for <strong>${formatCurrency(r.amount)}</strong> will be reversed with an adjusting ledger entry. The original payment and receipt stay on record, clearly marked REVERSED.</p>
    <form id="revForm" style="margin-top:12px;">
      <div class="sa-form-group"><label>Reason <span class="req">*</span></label><textarea class="sa-input" id="revReason" rows="3" placeholder="e.g. Duplicate entry / wrong student"></textarea></div>
      <div class="sa-modal-actions">
        <button type="button" class="sa-btn sa-btn-ghost" onclick="document.getElementById('modalRoot').innerHTML=''">Cancel</button>
        <button type="submit" class="sa-btn sa-btn-danger" id="revBtn"><i class="fa-solid fa-rotate-left"></i> Reverse Payment</button>
      </div>
    </form>`);
  document.getElementById("revForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const reason = document.getElementById("revReason").value.trim();
    if (!reason) { showToast("A reversal reason is required.", "warning"); return; }
    const btn = document.getElementById("revBtn");
    btn.disabled = true; btn.innerHTML = "Reversing…";
    try {
      await apiPost(`/api/payments/${r.id}/reverse`, { reason });
      showToast("Payment reversed.", "success");
      document.getElementById("modalRoot").innerHTML = "";
      state.offset = 0; load();
    } catch (err) {
      showToast(err.message || "Reversal failed.", "error");
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-rotate-left"></i> Reverse Payment';
    }
  });
}

/* ---------- Record a refund against a payment ---------- */
function refundModal(r) {
  openModal(`<h3 class="sa-modal-title">Record Refund</h3>
    <p class="sa-modal-message" style="margin-top:8px;">Refund money received under receipt <strong>${escapeHtml(r.receipt_no || "")}</strong>. A refund debit is posted to the student's ledger.</p>
    <form id="refForm" class="sa-form-grid" novalidate style="margin-top:12px;">
      <div class="sa-form-group"><label>Amount (KSh) <span class="req">*</span></label><input class="sa-input" type="number" min="0.01" step="0.01" max="${Number(r.amount) || 0}" id="refAmount" value="${Number(r.amount) || 0}"></div>
      <div class="sa-form-group"><label>Refund Method</label><select class="sa-select" id="refMethod"><option>Cash</option><option>M-Pesa</option><option>Bank</option><option>Cheque</option></select></div>
      <div class="sa-form-group full"><label>Reason <span class="req">*</span></label><textarea class="sa-input" id="refReason" rows="2" placeholder="e.g. Overpayment refunded to parent"></textarea></div>
      <div class="sa-modal-actions" style="grid-column:1/-1;">
        <button type="button" class="sa-btn sa-btn-ghost" onclick="document.getElementById('modalRoot').innerHTML=''">Cancel</button>
        <button type="submit" class="sa-btn sa-btn-danger" id="refBtn"><i class="fa-solid fa-money-bill-transfer"></i> Process Refund</button>
      </div>
    </form>`);
  document.getElementById("refForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const amount = Number(document.getElementById("refAmount").value);
    const reason = document.getElementById("refReason").value.trim();
    if (!(amount > 0)) { showToast("Enter a valid refund amount.", "warning"); return; }
    if (!reason) { showToast("A refund reason is required.", "warning"); return; }
    if (amount > Number(r.amount)) { showToast("Refund cannot exceed the original payment.", "warning"); return; }
    const btn = document.getElementById("refBtn");
    btn.disabled = true; btn.innerHTML = "Processing…";
    try {
      await apiPost(`/api/payments/${r.id}/refund`, { amount, reason, method: document.getElementById("refMethod").value.toUpperCase() });
      showToast("Refund processed.", "success");
      document.getElementById("modalRoot").innerHTML = "";
      state.offset = 0; load();
    } catch (err) {
      showToast(err.message || "Refund failed.", "error");
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-money-bill-transfer"></i> Process Refund';
    }
  });
}

function form(rec) {
  const isEdit = !!rec;
  let hasStudentPicker = false;
  const fieldsHtml = CFG.fields.map((f) => {
    const v = rec ? (rec[f.id] ?? "") : "";
    const req = f.req ? ' <span class="req">*</span>' : "";
    let inp;
    if (f.type === "select") inp = `<select class="sa-select" data-f="${f.id}">` + f.options.map((o) => `<option value="${o}"${String(v) === o ? " selected" : ""}>${o}</option>`).join("") + `</select>`;
    else if (f.type === "checkbox") inp = `<input type="checkbox" data-f="${f.id}" ${v ? "checked" : ""}>`;
    else if (f.type === "textarea") inp = `<textarea class="sa-input" data-f="${f.id}" rows="2">${escapeHtml(v)}</textarea>`;
    else if (f.type === "ref") {
      if (f.ref === "stu") {
        hasStudentPicker = true;
        inp = `<div id="studentPicker"></div><input type="hidden" data-f="${f.id}" value="${escapeHtml(String(v ?? ""))}">`;
      } else {
        inp = `<select class="sa-select" data-f="${f.id}"><option value="">None</option>` + (REF[f.ref] || []).map((o) => `<option value="${o.id}"${v === o.id ? " selected" : ""}>${escapeHtml(o.label)}</option>`).join("") + `</select>`;
      }
    }
    else inp = `<input class="sa-input" type="${f.type || "text"}" data-f="${f.id}" value="${escapeHtml(String(v ?? "").slice(0, f.type === "date" ? 10 : 999))}">`;
    return `<div class="sa-form-group${f.full ? " full" : ""}"><label>${f.label}${req}</label>${inp}</div>`;
  }).join("");
  openModal(`<h3 class="sa-modal-title">${isEdit ? "Edit record" : "Add record"}</h3><form id="gf" class="sa-form-grid" novalidate style="margin-top:14px;">` + fieldsHtml + `<div class="sa-modal-actions" style="grid-column:1/-1;"><button type="button" class="sa-btn sa-btn-ghost" onclick="document.getElementById('modalRoot').innerHTML=''">Cancel</button><button type="submit" class="sa-btn sa-btn-primary" id="gfs">Save</button></div></form>`);

  if (hasStudentPicker) {
    const picker = searchableCombobox({
      container: document.getElementById("studentPicker"),
      options: (REF.stu || []).map((o) => ({ id: o.id, label: o.label })),
      multiple: false,
      selected: rec ? (rec.student_id || "") : "",
      placeholder: "Search student by name or admission no…",
      onChange: (id) => { document.querySelector('[data-f="student_id"]').value = id; }
    });
    if (rec && rec.student_id) picker.setValue(rec.student_id);
  }

  document.getElementById("gf").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {};
    CFG.fields.forEach((f) => { const el = document.querySelector('[data-f="' + f.id + '"]'); payload[f.id] = f.type === "checkbox" ? el.checked : el.value.trim(); });
    for (const f of CFG.fields) if (f.req && !payload[f.id]) { showToast(f.label + " is required.", "error"); return; }
    const sb = document.getElementById("gfs"); sb.disabled = true; sb.innerHTML = "Saving...";
    try {
      if (isEdit) {
        await apiPut(CFG.endpoint + "/" + rec.id, payload);
        showToast("Saved successfully.", "success"); document.getElementById("modalRoot").innerHTML = ""; state.offset = 0; load();
      } else {
        const res = await apiPost(CFG.endpoint, payload);
        document.getElementById("modalRoot").innerHTML = ""; state.offset = 0; load();
        view(Object.assign(res.payment || {}, { student_id: payload.student_id, applied_to_fees: res.applied_to_fees, credit_carried: res.credit_carried, outstanding_balance: res.outstanding_balance }));
        showToast("Payment recorded — print the receipt.", "success");
      }
    } catch (err) { showToast(err.message || "Save failed.", "error"); sb.disabled = false; sb.innerHTML = "Save"; }
  });
}
document.getElementById("addBtn").addEventListener("click", () => form(null));
const si = document.getElementById("searchInput");
si.style.display = CFG.search ? "block" : "none";
si.addEventListener("input", (e) => { clearTimeout(window.__t); window.__t = setTimeout(() => { state.search = e.target.value.trim(); state.offset = 0; load(); }, 350); });
const ss = document.getElementById("statusSel");
ss.style.display = CFG.statuses ? "block" : "none";
